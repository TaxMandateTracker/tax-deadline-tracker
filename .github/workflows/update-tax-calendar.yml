name: Update Tax Calendar

on:
  schedule:
    - cron: '0 0 * * 0'
  workflow_dispatch:
    inputs:
      year:
        description: 'Tax year to process (leave empty for current year)'
        required: false
        default: ''

jobs:
  update-calendar:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install requests pypdf python-dateutil psycopg2-binary python-dotenv

      - name: Run tax calendar update
        env:
          TAX_YEAR: ${{ github.event.inputs.year }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          python scripts/update_tax_calendar.py

      - name: Report success
        run: echo "Tax calendar updated successfully"